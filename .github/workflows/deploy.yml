name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Bust (auto-version CSS & JS)
        run: |
          STAMP=$(date +%Y%m%d_%H%M%S)
          sed -i "s|style.css?v=[^\"]*|style.css?v=${STAMP}|g" index.html
          sed -i "s|app.js?v=[^\"]*|app.js?v=${STAMP}|g" index.html
          echo "Cache bust applied: v=${STAMP}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
